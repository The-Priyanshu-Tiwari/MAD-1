{% extends "base.html" %}
{% block content %}
<h2>Admin Dashboard</h2>

<a href="{{ url_for('add_parking_lot') }}" class="btn btn-success mb-3">Add Parking Lot</a>

<div id="addLotForm" class="collapse mb-3">
    <form id="lotForm" class="card card-body">
        <input class="form-control mb-2" name="name" required placeholder="Lot name">
        <input class="form-control mb-2" name="address" placeholder="Address">
        <input class="form-control mb-2" name="price" type="number" step="0.01" required placeholder="Price per hour">
        <input class="form-control mb-2" name="max_spots" type="number" required placeholder="Number of spots">
        <button type="submit" class="btn btn-primary">Create</button>
    </form>
    <div id="lotMsg" class="mt-2"></div>
</div>

<table class="table table-striped mt-3">
    <thead>
        <tr>
            <th>Lot Name</th>
            <th>Location</th>
            <th>Total Spots</th>
            <th>Price</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody id="lotsBody">
        <!-- JS will populate rows here -->
    </tbody>
</table>

<script>
// 1. Handle Add Lot
document.getElementById('lotForm').onsubmit = async function(e) {
    e.preventDefault();
    let body = {
        name: this.name.value,
        address: this.address.value,
        price: parseFloat(this.price.value),
        max_spots: parseInt(this.max_spots.value)
    };
    let res = await fetch('/api/parkinglot', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(body),
        credentials: 'same-origin'
    });
    let data = await res.json();
    document.getElementById('lotMsg').innerHTML =
        data.message ? `<div class="alert alert-success">${data.message}</div>` :
        `<div class="alert alert-danger">${data.error}</div>`;
    if(res.status === 201) {
        this.reset();  // clear form
        loadLots();    // reload table
    }
};

// 2. Load lots via API and populate table
async function loadLots() {
    // For demo, let's fetch lot IDs (normally you'd want a /api/parkinglots GET endpoint)
    // For now, let's attempt 1-20 as an example; in real code you should add a backend endpoint to list all lots!
    let tbody = document.getElementById('lotsBody');
    tbody.innerHTML = "";
    for(let lot_id=1; lot_id<=20; lot_id++) {
        let res = await fetch(`/api/parkinglot/${lot_id}/slots`, {credentials: 'same-origin'});
        if(res.ok){
            let data = await res.json();
            let spots = data.spots ? data.spots.length : '';
            let row = `<tr>
                <td>${data.parking_lot}</td>
                <td>${data.address||'-'}</td>
                <td>${spots}</td>
                <td>${data.price||'-'}</td>
                <td>
                    <!-- Future: actions to edit/delete -->
                </td>
            </tr>`;
            tbody.innerHTML += row;
        }
    }
}
window.onload = loadLots;
</script>
{% endblock %}
