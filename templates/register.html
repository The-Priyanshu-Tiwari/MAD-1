{% extends "base.html" %}
{% block content %}
<style>
body {
  background-image: url("{{ url_for('static', filename='images/parking.jpg') }}");
  background-size: cover;
  background-repeat: no-repeat;
  background-attachment: fixed;
  font-family: 'Segoe UI', sans-serif;
  position: relative;
}
body::before {
  content: "";
  position: fixed;
  top: 0;
  left: 0;
  height: 100%;
  width: 100%;
  background: rgba(0, 0, 0, 0.55);
  z-index: -1;
}
.register-glass {
  max-width: 480px;
  margin: 80px auto;
  background: rgba(255, 255, 255, 0.15);
  backdrop-filter: blur(12px);
  border-radius: 20px;
  padding: 40px 30px;
  box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
  color: #fff;
}
.register-glass h2 {
  font-weight: 600;
  margin-bottom: 25px;
}
.register-glass label {
  font-weight: 500;
}
.register-glass input {
  background-color: rgba(255, 255, 255, 0.85);
  border: none;
  font-weight: 500;
}
.register-glass input:focus {
  border: 2px solid #198754;
  outline: none;
  box-shadow: none;
}
.password-toggle {
  position: absolute;
  right: 15px;
  top: 38px;
  cursor: pointer;
  color: #198754;
}
.register-glass a {
  color: #f8f9fa;
  text-decoration: underline;
}
</style>

<div class="register-glass">
  <h2 class="text-center">📝 Register</h2>
  <form id="registerForm">
    <div class="form-group mb-3 position-relative">
      <label><i class="bi bi-person-fill"></i> Username</label>
      <input type="text" name="username" class="form-control" placeholder="Enter username" required />
    </div>
    <div class="form-group mb-3 position-relative">
      <label><i class="bi bi-lock-fill"></i> Password</label>
      <input type="password" name="password" id="passwordInput" class="form-control" placeholder="Enter password" required />
      <i class="bi bi-eye-slash-fill password-toggle" id="togglePassword"></i>
    </div>
    <div class="form-group mb-4">
      <label><i class="bi bi-person-badge-fill"></i> Role <small>(admin/user)</small></label>
      <input type="text" name="role" class="form-control" placeholder="user" />
    </div>
    <input type="submit" value="Register" class="btn btn-success w-100" />
  </form>
  <div id="registerMsg" class="mt-3"></div>
  <div class="mt-3 text-center">
    <a href="{{ url_for('login') }}">← Back to Login</a>
  </div>
</div>

<!-- Bootstrap Icons -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

<script>
document.getElementById('registerForm').onsubmit = function(e) {
    e.preventDefault();
    const form = this;
    fetch('/register', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
            username: form.username.value,
            password: form.password.value,
            role: form.role.value || "user"
        }),
        credentials: 'same-origin'
    })
    .then(response =>
        response.json().then(data => ({status: response.status, body: data}))
    ).then(result => {
        const msg = document.getElementById('registerMsg');
        if(result.status === 201) {
            msg.innerHTML = `<div class="alert alert-success">${result.body.message || "Registration Successful!"}</div>`;
            setTimeout(() => window.location.href = "{{ url_for('login') }}", 1200);
        } else {
            msg.innerHTML = `<div class="alert alert-danger">${result.body.error || "Registration failed!"}</div>`;
        }
    })
    .catch(error => {
        document.getElementById('registerMsg').innerHTML = `<div class="alert alert-danger">Error: ${error}</div>`;
    });
};

// Show/Hide Password Logic
document.getElementById('togglePassword').addEventListener('click', function () {
  const pwdInput = document.getElementById('passwordInput');
  const type = pwdInput.getAttribute('type') === 'password' ? 'text' : 'password';
  pwdInput.setAttribute('type', type);
  this.classList.toggle('bi-eye');
  this.classList.toggle('bi-eye-slash-fill');
});
</script>
{% endblock %}
