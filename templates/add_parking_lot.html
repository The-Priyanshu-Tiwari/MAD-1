{% extends "base.html" %}
{% block content %}
<h2>Add Parking Lot</h2>

<form id="addLotForm">
  <div class="form-group mb-3">
    <label for="name">Lot Name</label>
    <input type="text" class="form-control" id="name" name="name" placeholder="Enter lot name" required>
  </div>

  <div class="form-group mb-3">
    <label for="price">Price per hour</label>
    <input type="number" step="0.01" class="form-control" id="price" name="price" placeholder="Enter price" required>
  </div>

  <div class="form-group mb-3">
    <label for="address">Address</label>
    <input type="text" class="form-control" id="address" name="address" placeholder="Enter address">
  </div>

  <div class="form-group mb-3">
    <label for="max_spots">Maximum Spots</label>
    <input type="number" class="form-control" id="max_spots" name="max_spots" placeholder="Enter max spots" required>
  </div>

  <button type="submit" class="btn btn-success">Create Parking Lot</button>
</form>

<div id="formMsg" class="mt-3"></div>

<script>
document.getElementById('addLotForm').onsubmit = async function(event) {
  event.preventDefault();

  const name = this.name.value.trim();
  const price = parseFloat(this.price.value);
  const address = this.address.value.trim();
  const max_spots = parseInt(this.max_spots.value);

  if (!name || isNaN(price) || isNaN(max_spots)) {
    document.getElementById('formMsg').innerHTML = '<div class="alert alert-danger">Please fill in all required fields correctly.</div>';
    return;
  }

  try {
    const response = await fetch('/api/parkinglot', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      credentials: 'same-origin',
      body: JSON.stringify({ name, price, address, max_spots })
    });

    const data = await response.json();

    if (response.status === 201) {
      document.getElementById('formMsg').innerHTML = `<div class="alert alert-success">${data.message}</div>`;
      setTimeout(() => {
        window.location.href = '/admin/dashboard'; // Redirect back to admin dashboard
      }, 1500);
    } else {
      document.getElementById('formMsg').innerHTML = `<div class="alert alert-danger">${data.error || 'Failed to create parking lot'}</div>`;
    }
  } catch (error) {
    document.getElementById('formMsg').innerHTML = `<div class="alert alert-danger">Error: ${error.message}</div>`;
  }
};
</script>
{% endblock %}
