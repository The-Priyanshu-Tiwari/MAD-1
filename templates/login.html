{% extends "base.html" %}
{% block content %}
<style>
body {
  background-image: url("{{ url_for('static', filename='images/parking.jpg') }}");
  background-size: cover;
  background-repeat: no-repeat;
  background-attachment: fixed;
  font-family: 'Segoe UI', sans-serif;
  position: relative;
}
body::before {
  content: "";
  position: fixed;
  top: 0;
  left: 0;
  height: 100%;
  width: 100%;
  background: rgba(0, 0, 0, 0.55);
  z-index: -1;
}
.login-glass {
  max-width: 440px;
  margin: 100px auto;
  background: rgba(255, 255, 255, 0.15);
  backdrop-filter: blur(12px);
  border-radius: 20px;
  padding: 40px 30px;
  box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
  color: #fff;
}
.login-glass h2 {
  font-weight: 600;
  margin-bottom: 25px;
}
.login-glass label {
  font-weight: 500;
}
.login-glass input {
  background-color: rgba(255, 255, 255, 0.85);
  border: none;
  font-weight: 500;
}
.login-glass input:focus {
  border: 2px solid #0d6efd;
  outline: none;
  box-shadow: none;
}
.password-toggle {
  position: absolute;
  right: 15px;
  top: 38px;
  cursor: pointer;
  color: #0d6efd;
}
.login-glass a {
  color: #f8f9fa;
  text-decoration: underline;
}
</style>

<div class="login-glass">
  <h2 class="text-center">🔐 User Login</h2>
  <form id="loginForm">
    <div class="form-group mb-3 position-relative">
        <label><i class="bi bi-person-fill"></i> Username</label>
        <input type="text" name="username" class="form-control" placeholder="Enter username" required />
    </div>
    <div class="form-group mb-4 position-relative">
        <label><i class="bi bi-lock-fill"></i> Password</label>
        <input type="password" name="password" id="passwordInput" class="form-control" placeholder="Enter password" required />
        <i class="bi bi-eye-slash-fill password-toggle" id="togglePassword"></i>
    </div>
    <input type="submit" value="Login" class="btn btn-primary w-100" />
  </form>
  <div id="loginMsg" class="mt-3"></div>
  <div class="mt-3 text-center">
    <a href="{{ url_for('register') }}">Register as a new user</a>
  </div>
</div>

<!-- Bootstrap Icons -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

<script>
document.getElementById('loginForm').onsubmit = function(e) {
    e.preventDefault();
    const form = this;
    fetch('/login', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
            username: form.username.value,
            password: form.password.value,
        }),
        credentials: 'same-origin'
    })
    .then(response =>
        response.json().then(data => ({status: response.status, body: data}))
    )
    .then(result => {
        const msg = document.getElementById('loginMsg');
        if(result.status === 200) {
            msg.innerHTML = `<div class="alert alert-success">${result.body.message}</div>`;
            setTimeout(() => {
                window.location.href = result.body.role === "admin" ? "/admin/dashboard" : "/user/dashboard";
            }, 1000);
        } else {
            msg.innerHTML = `<div class="alert alert-danger">${result.body.error || 'Login failed!'}</div>`;
        }
    })
    .catch(error => {
        document.getElementById('loginMsg').innerHTML = `<div class="alert alert-danger">Error: ${error}</div>`;
    });
};

// Show/Hide Password
document.getElementById('togglePassword').addEventListener('click', function () {
  const pwdInput = document.getElementById('passwordInput');
  const type = pwdInput.getAttribute('type') === 'password' ? 'text' : 'password';
  pwdInput.setAttribute('type', type);
  this.classList.toggle('bi-eye');
  this.classList.toggle('bi-eye-slash-fill');
});
</script>
{% endblock %}
