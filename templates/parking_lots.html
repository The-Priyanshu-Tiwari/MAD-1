{% extends "base.html" %}
{% block content %}
<style>
body {
  background-image: url("{{ url_for('static', filename='images/parking.jpg') }}");
  background-size: cover;
  background-repeat: no-repeat;
  background-attachment: fixed;
}

.lot-container {
  background-color: rgba(255, 255, 255, 0.95);
  padding: 30px;
  border-radius: 12px;
  margin-top: 50px;
  box-shadow: 0 8px 18px rgba(0, 0, 0, 0.2);
}
</style>

<div class="lot-container">
  <h2 class="text-center text-dark mb-4">All Parking Lots</h2>

  <div class="table-responsive">
    <table class="table table-bordered table-hover">
      <thead class="table-dark">
        <tr>
          <th>Lot ID</th>
          <th>Name</th>
          <th>Address</th>
          <th>Price (per hour)</th>
          <th>Total Spots</th>
          <th>Available Spots</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="lotsBody">
        <!-- Populated dynamically via JS -->
      </tbody>
    </table>
  </div>
  <div id="lotMsg" class="mt-3"></div>
</div>

<script>
async function loadParkingLots() {
    const tbody = document.getElementById('lotsBody');
    tbody.innerHTML = "";
    let res = await fetch('/api/parkinglots', {credentials: 'same-origin'});
    if(res.ok) {
        let lots = await res.json();
        for (const lot of lots) {
            let slotRes = await fetch(`/api/parkinglot/${lot.id}/slots`, {credentials: 'same-origin'});
            let slotData = slotRes.ok ? await slotRes.json() : {spots: []};
            let available = slotData.spots.filter(s => s.status === "A").length;
            let row = `<tr>
                <td>${lot.id}</td>
                <td>${lot.name}</td>
                <td>${lot.address || '-'}</td>
                <td>₹${lot.price}</td>
                <td>${lot.max_spots}</td>
                <td>${available} / ${lot.max_spots}</td>
                <td>
                    <a href="/parking_lots/${lot.id}" class="btn btn-info btn-sm">View Slots</a>
                </td>
            </tr>`;
            tbody.innerHTML += row;
        }
    } else {
        document.getElementById('lotMsg').innerHTML = `<div class="alert alert-danger">Failed to load parking lots.</div>`;
    }
}
window.onload = loadParkingLots;
</script>
{% endblock %}
