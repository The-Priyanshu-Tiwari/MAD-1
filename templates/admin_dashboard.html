{% extends "base.html" %}
{% block content %}
<style>
body {
  background-image: url("{{ url_for('static', filename='images/parking.jpg') }}");
  background-size: cover;
  background-repeat: no-repeat;
  background-attachment: fixed;
  font-family: 'Segoe UI', sans-serif;
  color: #ffffff;
}
.admin-wrapper {
  background-color: rgba(0, 0, 0, 0.65);
  min-height: 100vh;
  padding: 40px;
}
.glass-card {
  background: rgba(71, 69, 69, 0.97);
  backdrop-filter: blur(10px);
  padding: 30px;
  border-radius: 16px;
  box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
  color: #fff;
}
.table th, .table td {
  color: #000000;
}
</style>

<div class="admin-wrapper">
  <h2 class="mb-4">🔧 Admin Dashboard</h2>

  <div class="glass-card">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h4 class="mb-0">🄹️ Manage Parking Lots</h4>
      <div class="d-flex gap-2">
        <a href="{{ url_for('add_parking_lot') }}" class="btn btn-success">Add Parking Lot</a>
        <button class="btn btn-primary" onclick="toggleUserSection()">👤 User Details</button>
      </div>
    </div>

    <!-- User Detail Section (Hidden by default) -->
    <div id="userSection" style="display:none;">
      <h5 class="mt-3 mb-3">🧑‍💼 All Registered Users</h5>
      <div class="mb-3">
        <select class="form-select" id="userDropdown" onchange="loadUserDetails(this.value)">
          <option selected disabled>Select a user</option>
        </select>
      </div>

      <!-- 🔁 Block/Unblock Button Section -->
      <div id="userControlButtons" class="mb-3" style="display:none;">
        <button id="blockUnblockBtn" class="btn btn-warning" onclick="toggleBlockUser()">Loading...</button>
      </div>

      <div id="userDetailsBox" class="glass-card mt-3" style="display:none;">
        <h6>User Booking History</h6>
        <table class="table table-bordered table-sm table-hover">
          <thead class="table-light text-dark">
            <tr><th>ID</th><th>Lot</th><th>Spot</th><th>Start</th><th>End</th><th>Cost</th></tr>
          </thead>
          <tbody id="userBookingsTable"></tbody>
        </table>
      </div>
    </div>

    <div id="lotMsg" class="mb-4"></div>

    <div class="table-responsive">
      <table class="table table-striped table-hover">
        <thead>
          <tr>
            <th>Lot Name</th>
            <th>Location</th>
            <th>Total Spots</th>
            <th>Price/hr</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="lotsBody">
          <!-- JS will populate rows -->
        </tbody>
      </table>
    </div>

    <hr class="my-5">
    <h4>📊 Revenue Summary</h4>
    <div class="glass-card mt-3">
      <canvas id="revenueChart" height="150"></canvas>
    </div>
  </div>
</div>

<!-- Edit Modal -->
<div class="modal fade" id="editModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content text-dark">
      <div class="modal-header">
        <h5 class="modal-title">Edit Parking Lot</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="editForm">
          <input type="hidden" name="id">
          <div class="mb-2"><input type="text" name="name" class="form-control" placeholder="Lot Name" required></div>
          <div class="mb-2"><input type="text" name="address" class="form-control" placeholder="Address"></div>
          <div class="mb-2"><input type="number" step="0.01" name="price" class="form-control" placeholder="Price/hr" required></div>
          <div class="mb-2"><input type="number" name="max_spots" class="form-control" placeholder="Max Spots" required></div>
          <div class="text-end">
            <button type="submit" class="btn btn-primary">Save Changes</button>
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          </div>
        </form>
        <div id="editMsg" class="mt-2"></div>
      </div>
    </div>
  </div>
</div>

<!-- Chart.js + JS Logic -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
let selectedUser = null;
let selectedUserBlocked = false;

function toggleUserSection() {
  const sec = document.getElementById("userSection");
  sec.style.display = sec.style.display === "none" ? "block" : "none";
}

async function loadAllUsers() {
  const res = await fetch('/api/admin/users');
  if (res.ok) {
    const users = await res.json();
    const sel = document.getElementById("userDropdown");
    sel.innerHTML = '<option selected disabled>Select a user</option>';
    users
      .filter(u => u.role !== 'admin')  // skip admin
      .forEach(u => {
        sel.innerHTML += `<option value="${u.id}">${u.username}</option>`;
      });
  }
}

async function loadUserDetails(uid) {
  selectedUser = uid;
  console.log("Loading user details for:", uid);
  document.getElementById('userBookingsTable').innerHTML = '';
  const bookingBox = document.getElementById('userDetailsBox');
  bookingBox.style.display = 'none';

  // Fetch bookings
  const res = await fetch(`/api/admin/user/${uid}/bookings`);
  const bookings = res.ok ? await res.json() : [];

  if (bookings.length === 0) {
    document.getElementById('userBookingsTable').innerHTML = '<tr><td colspan="6">No bookings found.</td></tr>';
  } else {
    bookings.forEach(b => {
      document.getElementById('userBookingsTable').innerHTML += `
        <tr>
          <td>${b.id}</td>
          <td>${b.lot_name}</td>
          <td>${b.spot_id}</td>
          <td>${new Date(b.start_time).toLocaleString()}</td>
          <td>${new Date(b.end_time).toLocaleString()}</td>
          <td>₹${b.cost.toFixed(2)}</td>
        </tr>`;
    });
  }
  bookingBox.style.display = 'block';

  // Fetch block status
  const userRes = await fetch(`/api/admin/user/${uid}`);
  const userData = await userRes.json();
  selectedUserBlocked = userData.is_blocked;

  const btn = document.getElementById('blockUnblockBtn');
  btn.innerText = selectedUserBlocked ? '✅ Unblock User' : '🚫 Block User';
  btn.className = selectedUserBlocked ? 'btn btn-success' : 'btn btn-danger';

  document.getElementById('userControlButtons').style.display = 'block';
}

async function toggleBlockUser() {
  if (!selectedUser) return;

  const url = `/api/admin/user/${selectedUser}/toggle_block`;
  const res = await fetch(url, { method: 'PATCH' });

  if (res.ok) {
    selectedUserBlocked = !selectedUserBlocked;
    const btn = document.getElementById('blockUnblockBtn');
    btn.innerText = selectedUserBlocked ? '✅ Unblock User' : '🚫 Block User';
    btn.className = selectedUserBlocked ? 'btn btn-success' : 'btn btn-danger';
    alert('User status updated!');
  } else {
    alert('Failed to update user status.');
  }
}


async function loadLots() {
  const tbody = document.getElementById('lotsBody');
  tbody.innerHTML = "";
  const res = await fetch('/api/parkinglots');
  if (!res.ok) {
    tbody.innerHTML = `<tr><td colspan="5">Failed to load lots</td></tr>`;
    return;
  }
  const lots = await res.json();
  lots.forEach(lot => {
    const row = `<tr>
      <td>${lot.name}</td>
      <td>${lot.address || '-'}</td>
      <td>${lot.max_spots}</td>
      <td>₹${lot.price}</td>
      <td>
        <button class="btn btn-sm btn-warning me-1" onclick='openEditModal(${lot.id})'>Edit</button>
        <button class="btn btn-sm btn-danger" onclick='deleteLot(${lot.id})'>Delete</button>
      </td>
    </tr>`;
    tbody.innerHTML += row;
  });
}

async function openEditModal(id) {
  const res = await fetch(`/api/parkinglot/${id}`);
  if (res.ok) {
    const data = await res.json();
    const form = document.getElementById('editForm');
    form.id.value = id;
    form.name.value = data.name;
    form.address.value = data.address || '';
    form.price.value = data.price;
    form.max_spots.value = data.max_spots;
    new bootstrap.Modal(document.getElementById('editModal')).show();
  } else {
    document.getElementById('lotMsg').innerHTML = `<div class="alert alert-danger">Failed to load lot.</div>`;
  }
}

async function deleteLot(id) {
  if (!confirm("Are you sure you want to delete this lot?")) return;
  const res = await fetch(`/api/parkinglot/${id}`, {
    method: 'DELETE',
    credentials: 'same-origin'
  });
  if (res.ok) {
    document.getElementById('lotMsg').innerHTML = `<div class="alert alert-success">Lot deleted successfully!</div>`;
    loadLots();
  } else {
    document.getElementById('lotMsg').innerHTML = `<div class="alert alert-danger">Failed to delete lot.</div>`;
  }
}

window.onload = () => {
  loadLots();
  loadAllUsers();
};
const lotNames = {{ lot_names|tojson }};
const lotRevenues = {{ lot_revenues|tojson }};

if (lotNames.length && lotRevenues.length) {
  const ctx = document.getElementById('revenueChart').getContext('2d');
  const revenueChart = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: lotNames,
      datasets: [{
        label: 'Revenue (₹)',
        data: lotRevenues,
        backgroundColor: 'rgba(232, 235, 54, 0.7)',
        borderColor: 'rgba(0, 0, 0, 1)',
        borderWidth: 1
      }]
    },
    options: {
      scales: {
        x: {
          ticks: {
            color: '#ffffff'  // X-axis label color
          },
          grid: {
            color: 'rgba(255, 255, 255, 0.2)'  // Optional grid lines
          }
        },
        y: {
          beginAtZero: true,
          ticks: {
            color: '#ffffff',  // Y-axis label color
            callback: function(value) {
              return '₹' + value;
            }
          },
          grid: {
            color: 'rgba(255, 255, 255, 0.2)'
          }
        }
      },
      plugins: {
        legend: {
          labels: {
            color: '#ffffff'  // Legend label color
          }
        }
      }
    }
  });
}
</script>
{% endblock %}
