{% extends "base.html" %}
{% block content %}
<style>
body {
  background-image: url("{{ url_for('static', filename='images/parking.jpg') }}");
  background-size: cover;
  background-repeat: no-repeat;
  background-attachment: fixed;
  font-family: 'Segoe UI', sans-serif;
  color: #fff;
}

.admin-wrapper {
  background-color: rgba(0, 0, 0, 0.65);
  min-height: 100vh;
  padding: 40px;
}

.glass-card {
  background: rgba(255, 255, 255, 0.12);
  backdrop-filter: blur(10px);
  padding: 30px;
  border-radius: 16px;
  box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
  color: #fff;
}

.table th, .table td {
  color: #000;
}
</style>

<div class="admin-wrapper">
  <h2 class="mb-4">🔧 Admin Dashboard</h2>

  <div class="glass-card">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h4 class="mb-0">🅿️ Manage Parking Lots</h4>
      <a href="{{ url_for('add_parking_lot') }}" class="btn btn-success">Add Parking Lot</a>
    </div>

    <form id="lotForm" class="row g-3 mb-4">
      <input type="hidden" name="id">
      <div class="col-md-4">
        <input class="form-control" name="name" required placeholder="Lot name">
      </div>
      <div class="col-md-4">
        <input class="form-control" name="address" placeholder="Address">
      </div>
      <div class="col-md-2">
        <input class="form-control" name="price" type="number" step="0.01" required placeholder="Price/hr">
      </div>
      <div class="col-md-2">
        <input class="form-control" name="max_spots" type="number" required placeholder="Total spots">
      </div>
      <div class="col-md-12 d-grid">
        <button type="submit" class="btn btn-primary">Create Lot</button>
      </div>
    </form>
    <div id="lotMsg" class="mb-4"></div>

    <div class="table-responsive">
      <table class="table table-striped table-hover">
        <thead>
          <tr>
            <th>Lot Name</th>
            <th>Location</th>
            <th>Total Spots</th>
            <th>Price/hr</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="lotsBody">
          <!-- JS will populate rows -->
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- Edit Modal -->
<div class="modal fade" id="editModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content text-dark">
      <div class="modal-header">
        <h5 class="modal-title">Edit Parking Lot</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="editForm">
          <input type="hidden" name="id">
          <div class="mb-2"><input type="text" name="name" class="form-control" placeholder="Lot Name" required></div>
          <div class="mb-2"><input type="text" name="address" class="form-control" placeholder="Address"></div>
          <div class="mb-2"><input type="number" step="0.01" name="price" class="form-control" placeholder="Price/hr" required></div>
          <div class="mb-2"><input type="number" name="max_spots" class="form-control" placeholder="Max Spots" required></div>
          <div class="text-end">
            <button type="submit" class="btn btn-primary">Save Changes</button>
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          </div>
        </form>
        <div id="editMsg" class="mt-2"></div>
      </div>
    </div>
  </div>
</div>

<script>
const lotForm = document.getElementById('lotForm');
lotForm.onsubmit = async function(e) {
  e.preventDefault();
  const body = {
    name: this.name.value,
    address: this.address.value,
    price: parseFloat(this.price.value),
    max_spots: parseInt(this.max_spots.value)
  };
  const res = await fetch('/api/parkinglot', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(body),
    credentials: 'same-origin'
  });
  const data = await res.json();
  document.getElementById('lotMsg').innerHTML =
    res.status === 201
      ? `<div class="alert alert-success">${data.message}</div>`
      : `<div class="alert alert-danger">${data.error}</div>`;
  if (res.status === 201) {
    lotForm.reset();
    loadLots();
  }
};

async function loadLots() {
  const tbody = document.getElementById('lotsBody');
  tbody.innerHTML = "";
  for (let lot_id = 1; lot_id <= 100; lot_id++) {
    const res = await fetch(`/api/parkinglot/${lot_id}/slots`, {credentials: 'same-origin'});
    if (res.ok) {
      const data = await res.json();
      const spotCount = data.spots ? data.spots.length : 0;
      const row = `<tr>
        <td>${data.parking_lot}</td>
        <td>${data.address || '-'}</td>
        <td>${spotCount}</td>
        <td>₹${data.price || '-'}</td>
        <td>
          <button class="btn btn-sm btn-warning me-1" onclick='openEditModal(${lot_id})'>Edit</button>
          <button class="btn btn-sm btn-danger" onclick='deleteLot(${lot_id})'>Delete</button>
        </td>
      </tr>`;
      tbody.innerHTML += row;
    }
  }
}

async function openEditModal(id) {
  const res = await fetch(`/api/parkinglot/${id}/slots`, {credentials: 'same-origin'});
  if (res.ok) {
    const data = await res.json();
    console.log("Fetched lot data for edit:", data);
    const form = document.getElementById('editForm');
    form.id.value = id;
    form.name.value = data.parking_lot;
    form.address.value = data.address || '';
    form.price.value = data.price;
    form.max_spots.value = data.spots.length;
    new bootstrap.Modal(document.getElementById('editModal')).show();
  }
}

document.getElementById('editForm').onsubmit = async function(e) {
  e.preventDefault();
  const form = this;
  const id = form.id.value;
  const body = {
    name: form.name.value,
    address: form.address.value,
    price: parseFloat(form.price.value),
    max_spots: parseInt(form.max_spots.value)
  };
  const res = await fetch(`/api/parkinglot/${id}`, {
    method: 'PUT',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(body),
    credentials: 'same-origin'
  });
  const data = await res.json();
  document.getElementById('editMsg').innerHTML =
    res.status === 200
      ? `<div class="alert alert-success">${data.message}</div>`
      : `<div class="alert alert-danger">${data.error}</div>`;
  if (res.status === 200) {
    setTimeout(() => {
      bootstrap.Modal.getInstance(document.getElementById('editModal')).hide();
      loadLots();
    }, 1000);
  }
};

async function deleteLot(id) {
  if (!confirm("Are you sure you want to delete this parking lot?")) return;
  const res = await fetch(`/api/parkinglot/${id}`, {
    method: 'DELETE',
    credentials: 'same-origin'
  });
  const data = await res.json();
  alert(data.message || data.error);
  loadLots();
}

window.onload = loadLots;
</script>
{% endblock %}
