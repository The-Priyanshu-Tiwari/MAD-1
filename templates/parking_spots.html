{% extends "base.html" %}
{% block content %}
<style>
body {
  background-image: url("{{ url_for('static', filename='images/parking.jpg') }}");
  background-size: cover;
  background-attachment: fixed;
  background-repeat: no-repeat;
}

.spot-container {
  background-color: rgba(255, 255, 255, 0.95);
  padding: 30px;
  border-radius: 12px;
  margin-top: 50px;
  box-shadow: 0 8px 18px rgba(0, 0, 0, 0.2);
}
</style>

<div class="spot-container">
  <h2 class="text-center text-dark mb-4">Parking Spots</h2>

  <div class="mb-4">
    <label for="lotSelect" class="form-label"><strong>Select Parking Lot:</strong></label>
    <select id="lotSelect" class="form-select">
      <!-- JS will populate -->
    </select>
  </div>

  <div class="table-responsive">
    <table class="table table-bordered table-striped">
      <thead class="table-dark">
        <tr>
          <th>Spot ID</th>
          <th>Status</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="spotsBody">
        <!-- JS fills this -->
      </tbody>
    </table>
  </div>

  <div id="spotMsg"></div>

  <!-- Booking Form -->
  <div id="bookArea" class="card mt-5 p-4 shadow" style="display:none;">
    <h4>Book Parking Spot <span id="bookSpotId"></span></h4>
    <form id="bookForm">
      <input type="hidden" name="spot_id" id="bookSpotInput">
      <div class="mb-3">
        <label class="form-label">Duration (minutes):</label>
        <input type="number" class="form-control" name="duration_minutes" value="60" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Start Time (optional):</label>
        <input type="datetime-local" class="form-control" name="start_time">
      </div>
      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary">Book</button>
        <button type="button" class="btn btn-secondary" id="bookCancel">Cancel</button>
      </div>
    </form>
    <div id="bookMsg" class="mt-3"></div>
  </div>
</div>

<script>
let lotsList = [];

async function loadLots() {
  let res = await fetch('/api/parkinglots', {credentials: 'same-origin'});
  if(res.ok) {
    lotsList = await res.json();
    let sel = document.getElementById('lotSelect');
    sel.innerHTML = "";
    lotsList.forEach(lot => {
      let opt = document.createElement('option');
      opt.value = lot.id;
      opt.innerText = `${lot.name} (${lot.address || '-'})`;
      sel.appendChild(opt);
    });
    if(lotsList.length > 0) loadSpots(lotsList[0].id);
  }
}

async function loadSpots(lot_id) {
  let tbody = document.getElementById('spotsBody');
  tbody.innerHTML = "";
  let res = await fetch(`/api/parkinglot/${lot_id}/slots`, {credentials: 'same-origin'});
  if(res.ok) {
    let data = await res.json();
    for(const spot of data.spots) {
      let statusBadge = spot.status === 'A'
        ? "<span class='badge bg-success'>Available</span>"
        : "<span class='badge bg-danger'>Occupied</span>";
      let bookBtn = spot.status === 'A'
        ? `<button class="btn btn-sm btn-primary" onclick="showBookForm(${spot.id})">Book</button>`
        : "-";
      tbody.innerHTML += `<tr>
        <td>${spot.id}</td>
        <td>${statusBadge}</td>
        <td>${bookBtn}</td>
      </tr>`;
    }
  } else {
    tbody.innerHTML = "<tr><td colspan='3'>Failed to load parking spots.</td></tr>";
  }
}

document.getElementById('lotSelect').onchange = function() {
  loadSpots(this.value);
};

function showBookForm(spotId) {
  document.getElementById('bookArea').style.display = "block";
  document.getElementById('bookSpotId').innerText = spotId;
  document.getElementById('bookSpotInput').value = spotId;
  document.getElementById('bookMsg').innerText = "";
}

document.getElementById('bookCancel').onclick = function() {
  document.getElementById('bookArea').style.display = "none";
};

document.getElementById('bookForm').onsubmit = async function(e) {
  e.preventDefault();
  const form = this;
  let body = {
    spot_id: Number(form.spot_id.value),
    duration_minutes: Number(form.duration_minutes.value)
  };
  if(form.start_time.value) {
    body.start_time = new Date(form.start_time.value).toISOString();
  }
  let res = await fetch('/api/bookings', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(body),
    credentials: 'same-origin'
  });
  let data = await res.json();
  let msg = document.getElementById('bookMsg');
  if(res.status === 201) {
    msg.innerHTML = `<div class="alert alert-success">${data.message}</div>`;
    setTimeout(()=>{
      document.getElementById('bookArea').style.display = "none";
      loadSpots(document.getElementById('lotSelect').value);
    }, 1200);
  } else {
    msg.innerHTML = `<div class="alert alert-danger">${data.error || data.message || "Booking failed!"}</div>`;
  }
};

window.onload = loadLots;
</script>
{% endblock %}
